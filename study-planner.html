<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudySec — Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --light-blue: #a7d8ff;
      --light-yellow: #fff1a8;
      --light-pink: #ffc6e5;
      --light-purple: #d6c6ff;
      --light-red: #ffb3b3;

      --text-dark: #1f2937;
      --text-dim: #374151;
      --bg: #fbfbff;
      --card-shadow: 0 10px 25px rgba(31, 41, 55, 0.12);
      --ring: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(1200px 800px at -10% -10%, var(--light-purple) 0%, transparent 60%),
        radial-gradient(1000px 700px at 110% -10%, var(--light-pink) 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 110%, var(--light-yellow) 0%, transparent 60%),
        radial-gradient(900px 700px at 110% 110%, var(--light-blue) 0%, transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }

    .topbar-wrap { position: sticky; top: 0; z-index: 50; padding: 16px 16px 0 16px; backdrop-filter: saturate(140%) blur(6px); }
    .topbar { display: flex; align-items: center; justify-content: space-between; border-radius: 14px; padding: 14px 18px; background: linear-gradient(90deg, rgba(214,198,255,0.85) 0%, rgba(255,198,229,0.85) 35%, rgba(255,241,168,0.85) 68%, rgba(167,216,255,0.85) 100%); box-shadow: 0 6px 18px rgba(31,41,55,0.15); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-dark); text-decoration: none; }
    .brand-badge { width: 36px; height: 36px; border-radius: 10px; background: conic-gradient(from 0deg, var(--light-purple), var(--light-pink), var(--light-yellow), var(--light-blue), var(--light-purple)); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7), 0 6px 14px rgba(31,41,55,0.18); }
    .brand-name { font-size: 20px; }
    .nav { display: flex; align-items: center; gap: 14px; }
    .nav a { text-decoration: none; color: var(--text-dim); font-weight: 600; padding: 10px 14px; border-radius: 10px; transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease; }
    .nav a:hover { transform: translateY(-1px); background: rgba(255,255,255,0.65); box-shadow: 0 8px 18px rgba(31,41,55,0.12); }

    .container { max-width: 1200px; margin: 28px auto 64px; padding: 0 16px; }
    .title { margin: 12px 0 6px 0; font-size: clamp(24px, 4vw, 36px); font-weight: 700; letter-spacing: 0.3px; background: linear-gradient(90deg, #5b21b6, #db2777, #ca8a04, #0369a1); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subtitle { margin: 0 0 8px 0; color: #374151; opacity: 0.9; }

    /* Layout */
    .layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; margin-top: 18px; }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

    .panel { background: rgba(255,255,255,0.85); border: 1px solid rgba(17,24,39,0.08); border-radius: 16px; box-shadow: var(--card-shadow); overflow: hidden; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; padding: 12px 14px; border-bottom: 1px solid rgba(17,24,39,0.08); background: linear-gradient(90deg, rgba(214,198,255,0.45), rgba(255,198,229,0.40), rgba(255,241,168,0.40), rgba(167,216,255,0.45)); font-weight: 700; }
    .panel-body { padding: 12px 14px; }

    .btn { font: inherit; font-weight: 600; border: 1px solid rgba(17,24,39,0.15); background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .btn.primary { background: linear-gradient(90deg, #60a5fa, #a78bfa); color: #fff; border: none; }
    .btn.danger { color: #b91c1c; border-color: rgba(185,28,28,0.35); }

    /* Planner (left) */
    .planner-toolbar { display:flex; gap:10px; flex-wrap:wrap; }
    .input { font: inherit; border: 1px solid rgba(17,24,39,0.15); background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 12px; }
    .task-list { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
    .task { display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.85); border: 1px solid rgba(17,24,39,0.08); }
    .task-title { display:flex; align-items:center; gap: 8px; }
    .task-title input[type="checkbox"] { width: 18px; height: 18px; }
    .task-title .name.done { text-decoration: line-through; opacity: 0.7; }
    .task-meta { display:flex; align-items:center; gap:8px; font-size: 12px; color: #374151; }
    .pill { padding: 4px 8px; border-radius: 999px; background: rgba(167,216,255,0.6); font-weight: 700; }

    /* Calendar (right) */
    .calendar-head { display:flex; align-items:center; justify-content:space-between; gap: 10px; }
    .month { font-weight: 700; }
    .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
    .dow { text-align:center; font-size:12px; color:#374151; }
    .day { aspect-ratio: 1 / 1; background: rgba(255,255,255,0.85); border: 1px solid rgba(17,24,39,0.08); border-radius: 10px; display:flex; align-items:flex-start; justify-content:flex-end; padding:6px; position:relative; cursor:pointer; }
    .day.other { opacity: 0.45; }
    .day.today { box-shadow: 0 0 0 2px #60a5fa inset; }
    .dot { position:absolute; left: 6px; bottom: 6px; width: 8px; height: 8px; border-radius: 999px; background: #a78bfa; }

    .events { margin-top: 12px; display:grid; gap:8px; }
    .event { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border-radius:10px; background: rgba(255,255,255,0.85); border:1px solid rgba(17,24,39,0.08); }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--ring); }
  </style>
</head>
<body>
  <div class="topbar-wrap">
    <header class="topbar" role="navigation" aria-label="Top Navigation">
      <a class="brand" href="home.html">
        <div class="brand-badge" aria-hidden="true"></div>
        <div class="brand-name">StudySec</div>
      </a>
      <nav class="nav">
        <a href="home.html">Home</a>
        <a href="notes.html">Notes</a>
        <a href="flashcards.html">Flashcards</a>
        <a href="qa.html">Q&A</a>
      </nav>
    </header>
  </div>

  <main class="container">
    <h1 class="title">Study Planner</h1>
    <p class="subtitle">Plan tasks on the left. Add events to the calendar on the right. Everything saves automatically.</p>

    <section class="layout">
      <!-- Planner -->
      <section class="panel">
        <div class="panel-head">
          <span>Planner</span>
          <div class="planner-toolbar">
            <input id="taskInput" class="input" placeholder="New task (e.g., Read Chapter 3)" />
            <input id="taskDue" class="input" type="date" />
            <select id="taskTag" class="input">
              <option value="General">General</option>
              <option value="Math">Math</option>
              <option value="Science">Science</option>
              <option value="Language">Language</option>
            </select>
            <button id="addTask" class="btn primary">Add Task</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="taskList" class="task-list"></div>
        </div>
      </section>

      <!-- Calendar -->
      <section class="panel">
        <div class="panel-head">
          <div class="calendar-head">
            <button id="prevMonth" class="btn" aria-label="Previous month">◀</button>
            <span id="monthLabel" class="month">Month YYYY</span>
            <button id="nextMonth" class="btn" aria-label="Next month">▶</button>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            <input id="eventTitle" class="input" placeholder="Event title" />
            <input id="eventTime" class="input" type="time" />
            <button id="addEvent" class="btn primary">Add to Selected Date</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="cal-grid" id="calGrid">
            <!-- DOW headers -->
          </div>
          <div id="selectedDateLabel" style="margin-top:10px; font-weight:700;"></div>
          <div id="eventList" class="events"></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    (function(){
      // Storage keys
      const TASKS_KEY = 'studysec.planner.tasks.v1';
      const EVENTS_KEY = 'studysec.planner.events.v1'; // map of yyyy-mm-dd -> [{id,title,time}]

      /** @typedef {{ id:string, name:string, done:boolean, tag:string, due:string }} Task */
      /** @type {Task[]} */
      let tasks = [];
      /** @type {Record<string, { id:string, title:string, time:string }[]>} */
      let eventsByDate = {};

      // Planner elements
      const taskInput = document.getElementById('taskInput');
      const taskDue = document.getElementById('taskDue');
      const taskTag = document.getElementById('taskTag');
      const addTask = document.getElementById('addTask');
      const taskList = document.getElementById('taskList');

      // Calendar elements
      const calGrid = document.getElementById('calGrid');
      const monthLabel = document.getElementById('monthLabel');
      const prevMonth = document.getElementById('prevMonth');
      const nextMonth = document.getElementById('nextMonth');
      const selectedDateLabel = document.getElementById('selectedDateLabel');
      const eventList = document.getElementById('eventList');
      const eventTitle = document.getElementById('eventTitle');
      const eventTime = document.getElementById('eventTime');
      const addEvent = document.getElementById('addEvent');

      function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
      function load(){
        try { tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]'); } catch { tasks = []; }
        try { eventsByDate = JSON.parse(localStorage.getItem(EVENTS_KEY) || '{}'); } catch { eventsByDate = {}; }
      }
      function persist(){ localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); localStorage.setItem(EVENTS_KEY, JSON.stringify(eventsByDate)); }

      // Planner logic
      function renderTasks(){
        taskList.innerHTML = '';
        if(tasks.length === 0){
          const d = document.createElement('div');
          d.className = 'task';
          d.textContent = 'No tasks yet. Add your first task above!';
          taskList.appendChild(d);
          return;
        }
        tasks
          .slice()
          .sort((a,b)=>{
            // Incomplete first, then by due date, then by name
            if(a.done !== b.done) return a.done ? 1 : -1;
            return (a.due||'').localeCompare(b.due||'') || a.name.localeCompare(b.name);
          })
          .forEach(t=> taskList.appendChild(renderTask(t)));
      }

      function renderTask(t){
        const row = document.createElement('div');
        row.className = 'task';

        const left = document.createElement('div');
        left.className = 'task-title';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!t.done;
        cb.addEventListener('change', ()=>{ t.done = cb.checked; persist(); renderTasks(); });
        const name = document.createElement('span'); name.className = 'name' + (t.done ? ' done' : ''); name.textContent = t.name;
        left.appendChild(cb); left.appendChild(name);

        const right = document.createElement('div');
        right.className = 'task-meta';
        if(t.tag){ const tag = document.createElement('span'); tag.className = 'pill'; tag.textContent = t.tag; right.appendChild(tag); }
        if(t.due){ const due = document.createElement('span'); due.textContent = t.due; right.appendChild(due); }
        const del = document.createElement('button'); del.className = 'btn danger'; del.textContent = 'Delete';
        del.addEventListener('click', ()=>{ if(confirm('Delete this task?')){ removeTask(t.id); }});
        right.appendChild(del);

        row.appendChild(left);
        row.appendChild(right);
        return row;
      }

      function addNewTask(){
        const name = taskInput.value.trim();
        const due = taskDue.value || '';
        const tag = taskTag.value || 'General';
        if(!name){ alert('Please enter a task name.'); return; }
        tasks.push({ id: uid(), name, done:false, tag, due });
        taskInput.value = ''; taskDue.value=''; taskTag.value='General';
        persist();
        renderTasks();
      }

      function removeTask(id){
        const i = tasks.findIndex(x=>x.id===id);
        if(i===-1) return;
        tasks.splice(i,1);
        persist();
        renderTasks();
      }

      addTask.addEventListener('click', addNewTask);
      taskInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ addNewTask(); }});

      // Calendar logic
      let viewYear, viewMonth; // 0-based month
      let selectedDate = toDateKey(new Date());

      function toDateKey(d){
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${day}`;
      }

      function fromKey(key){ const [y,m,d] = key.split('-').map(n=>parseInt(n,10)); return new Date(y, m-1, d); }

      function renderCalendar(){
        const now = new Date();
        const first = new Date(viewYear, viewMonth, 1);
        const startDay = new Date(first); startDay.setDate(1 - ((first.getDay()+6)%7)); // Monday as first day
        const monthName = first.toLocaleString(undefined, { month: 'long', year: 'numeric' });
        monthLabel.textContent = monthName;

        calGrid.innerHTML = '';
        const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
        dows.forEach(s=>{ const el=document.createElement('div'); el.className='dow'; el.textContent=s; calGrid.appendChild(el); });

        const todayKey = toDateKey(now);
        for(let i=0;i<42;i++){
          const date = new Date(startDay); date.setDate(startDay.getDate()+i);
          const key = toDateKey(date);
          const cell = document.createElement('div');
          cell.className = 'day';
          if(date.getMonth() !== viewMonth) cell.classList.add('other');
          if(key === todayKey) cell.classList.add('today');
          if(eventsByDate[key] && eventsByDate[key].length){ const dot=document.createElement('div'); dot.className='dot'; cell.appendChild(dot); }
          const num = document.createElement('div'); num.textContent = String(date.getDate()); num.style.fontWeight='700'; num.style.fontSize='12px';
          cell.appendChild(num);
          cell.addEventListener('click', ()=>{ selectedDate = key; renderSelectedDate(); });
          calGrid.appendChild(cell);
        }
        renderSelectedDate();
      }

      function renderSelectedDate(){
        const d = fromKey(selectedDate);
        selectedDateLabel.textContent = 'Selected: ' + d.toLocaleDateString();
        renderEvents();
      }

      function renderEvents(){
        eventList.innerHTML = '';
        const list = (eventsByDate[selectedDate] || []).slice().sort((a,b)=> (a.time||'').localeCompare(b.time||''));
        if(list.length === 0){
          const empty = document.createElement('div'); empty.className='event'; empty.textContent='No events. Add one above.'; eventList.appendChild(empty); return;
        }
        list.forEach(ev=>{
          const row = document.createElement('div'); row.className='event';
          const left = document.createElement('div'); left.textContent = (ev.time? ev.time + ' — ' : '') + ev.title; left.style.fontWeight='700';
          const del = document.createElement('button'); del.className='btn danger'; del.textContent='Delete';
          del.addEventListener('click', ()=>{ deleteEvent(ev.id); });
          row.appendChild(left); row.appendChild(del);
          eventList.appendChild(row);
        });
      }

      function addNewEvent(){
        const title = eventTitle.value.trim();
        const time = eventTime.value || '';
        if(!title){ alert('Enter an event title.'); return; }
        const list = eventsByDate[selectedDate] || (eventsByDate[selectedDate] = []);
        list.push({ id: uid(), title, time });
        eventTitle.value=''; eventTime.value='';
        persist();
        renderCalendar();
      }

      function deleteEvent(id){
        const list = eventsByDate[selectedDate] || [];
        const i = list.findIndex(x=>x.id===id);
        if(i===-1) return;
        list.splice(i,1);
        if(list.length===0) delete eventsByDate[selectedDate];
        persist();
        renderCalendar();
      }

      prevMonth.addEventListener('click', ()=>{ if(viewMonth===0){ viewMonth=11; viewYear--; } else viewMonth--; renderCalendar(); });
      nextMonth.addEventListener('click', ()=>{ if(viewMonth===11){ viewMonth=0; viewYear++; } else viewMonth++; renderCalendar(); });
      addEvent.addEventListener('click', addNewEvent);

      // Init
      load();
      const now = new Date();
      viewYear = now.getFullYear(); viewMonth = now.getMonth();
      selectedDate = toDateKey(now);
      renderTasks();
      renderCalendar();
    })();
  </script>
</body>
</html>
