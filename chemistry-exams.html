<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudySec — Chemistry National Exams Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --light-blue:#a7d8ff; --light-yellow:#fff1a8; --light-pink:#ffc6e5; --light-purple:#d6c6ff; --text-dark:#1f2937; --bg:#fbfbff; --card-shadow:0 10px 25px rgba(31,41,55,0.12); --ring:0 0 0 4px rgba(59,130,246,0.25); }
    html, body { height:100%; }
    body { margin:0; font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--text-dark); background: radial-gradient(1200px 800px at -10% -10%, var(--light-purple) 0%, transparent 60%), radial-gradient(1000px 700px at 110% -10%, var(--light-pink) 0%, transparent 60%), radial-gradient(900px 600px at -10% 110%, var(--light-yellow) 0%, transparent 60%), radial-gradient(900px 700px at 110% 110%, var(--light-blue) 0%, transparent 60%), var(--bg); background-attachment:fixed; }
    .topbar-wrap{ position:sticky; top:0; z-index:50; padding:16px 16px 0 16px; backdrop-filter:saturate(140%) blur(6px); }
    .topbar{ display:flex; align-items:center; justify-content:space-between; border-radius:14px; padding:14px 18px; background:linear-gradient(90deg, rgba(214,198,255,0.85) 0%, rgba(255,198,229,0.85) 35%, rgba(255,241,168,0.85) 68%, rgba(167,216,255,0.85) 100%); box-shadow:0 6px 18px rgba(31,41,55,0.15); }
    .brand{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:0.3px; color:#111; text-decoration:none; }
    .brand-badge{ width:36px; height:36px; border-radius:10px; background:conic-gradient(from 0deg, var(--light-purple), var(--light-pink), var(--light-yellow), var(--light-blue)); box-shadow:inset 0 0 0 2px rgba(255,255,255,0.7), 0 6px 14px rgba(31,41,55,0.18); }
    .brand-name{ font-size:20px; }
    .nav{ display:flex; gap:14px; }
    .nav a{ text-decoration:none; color:#374151; font-weight:600; padding:10px 14px; border-radius:10px; }
    .nav a:hover{ background:rgba(255,255,255,0.65); box-shadow:0 8px 18px rgba(31,41,55,0.12); }

    .container{ max-width:980px; margin:28px auto 64px; padding:0 16px; }
    .title{ margin:12px 0 6px 0; font-size:clamp(24px,4vw,36px); font-weight:700; letter-spacing:0.3px; background:linear-gradient(90deg,#5b21b6,#db2777,#ca8a04,#0369a1); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .subtitle{ margin:0 0 12px 0; color:#374151; opacity:0.9; }

    .list{ display:grid; grid-template-columns:1fr; gap:12px; margin-top:16px; }
    .link-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,0.85); border:1px solid rgba(17,24,39,0.08); box-shadow:var(--card-shadow); }
    .link-card a{ color:#0f172a; font-weight:700; text-decoration:none; }
    .actions{ display:flex; gap:8px; }
    .btn{ font:inherit; font-weight:600; border:1px solid rgba(17,24,39,0.15); background:rgba(255,255,255,0.9); padding:8px 12px; border-radius:10px; cursor:pointer; }
    .btn.primary{ background:linear-gradient(90deg,#60a5fa,#a78bfa); color:#fff; border:none; }
    .btn.danger{ color:#b91c1c; border-color:rgba(185,28,28,0.35); }

    .add{ margin-top:16px; background:rgba(255,255,255,0.85); border:1px solid rgba(17,24,39,0.08); border-radius:16px; box-shadow:var(--card-shadow); padding:12px; display:grid; grid-template-columns:1fr 1fr auto; gap:10px; }
    .input{ font:inherit; border:1px solid rgba(17,24,39,0.15); background:rgba(255,255,255,0.95); padding:10px 12px; border-radius:12px; }

    a:focus-visible, button:focus-visible, input:focus-visible{ outline:none; box-shadow:var(--ring); }
  </style>
</head>
<body>
  <div class="topbar-wrap">
    <header class="topbar" role="navigation" aria-label="Top Navigation">
      <a class="brand" href="home.html">
        <div class="brand-badge" aria-hidden="true"></div>
        <div class="brand-name">StudySec</div>
      </a>
      <nav class="nav">
        <a href="practice-tests.html">Back</a>
        <a href="home.html">Home</a>
      </nav>
    </header>
  </div>

  <main class="container">
    <h1 class="title">Chemistry National Exams — Practice Links</h1>
    <p class="subtitle">Add your links or use the list below.</p>

    <section id="list" class="list"></section>

    <div class="add">
      <input id="titleInput" class="input" placeholder="Title" />
      <input id="urlInput" class="input" placeholder="https://example.com" />
      <button id="addBtn" class="btn primary">Add Link</button>
    </div>
  </main>

  <script>
    (function(){
      const KEY = 'studysec.practice.chemistry.v1';
      let links = [];
      const list = document.getElementById('list');
      const titleInput = document.getElementById('titleInput');
      const urlInput = document.getElementById('urlInput');
      const addBtn = document.getElementById('addBtn');
      function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
      function load(){ try{ links = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { links = []; } }
      function persist(){ localStorage.setItem(KEY, JSON.stringify(links)); }
      function render(){ list.innerHTML=''; if(links.length===0){ const d=document.createElement('div'); d.className='link-card'; d.textContent='No links yet. Add one above.'; list.appendChild(d); return;} links.slice().sort((a,b)=>a.title.localeCompare(b.title)).forEach(addCard); }
      function addCard(l){ const row=document.createElement('div'); row.className='link-card'; const a=document.createElement('a'); a.href=l.url; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=l.title; const right=document.createElement('div'); right.className='actions'; const visit=document.createElement('a'); visit.className='btn'; visit.href=l.url; visit.target='_blank'; visit.textContent='Visit'; const del=document.createElement('button'); del.className='btn danger'; del.textContent='Delete'; del.addEventListener('click',()=>{ if(confirm('Delete this link?')) remove(l.id); }); right.appendChild(visit); right.appendChild(del); row.appendChild(a); row.appendChild(right); list.appendChild(row); }
      function add(){ const title=titleInput.value.trim(); const url=urlInput.value.trim(); if(!title || !/^https?:\/\//i.test(url)){ alert('Enter a title and valid http(s) URL'); return;} links.push({ id:uid(), title, url, createdAt:Date.now() }); persist(); titleInput.value=''; urlInput.value=''; render(); }
      function remove(id){ const i=links.findIndex(x=>x.id===id); if(i===-1) return; links.splice(i,1); persist(); render(); }
      addBtn.addEventListener('click', add); urlInput.addEventListener('keydown', e=>{ if(e.key==='Enter') add(); });
      load(); render();
    })();
  </script>
</body>
</html>
