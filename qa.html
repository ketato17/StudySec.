<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudySec — Q&A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --light-blue: #a7d8ff;
      --light-yellow: #fff1a8;
      --light-pink: #ffc6e5;
      --light-purple: #d6c6ff;
      --light-red: #ffb3b3;

      --text-dark: #1f2937;
      --text-dim: #374151;
      --bg: #fbfbff;
      --card-shadow: 0 10px 25px rgba(31, 41, 55, 0.12);
      --ring: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(1200px 800px at -10% -10%, var(--light-purple) 0%, transparent 60%),
        radial-gradient(1000px 700px at 110% -10%, var(--light-pink) 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 110%, var(--light-yellow) 0%, transparent 60%),
        radial-gradient(900px 700px at 110% 110%, var(--light-blue) 0%, transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }

    .topbar-wrap { position: sticky; top: 0; z-index: 50; padding: 16px 16px 0 16px; backdrop-filter: saturate(140%) blur(6px); }
    .topbar { display: flex; align-items: center; justify-content: space-between; border-radius: 14px; padding: 14px 18px; background: linear-gradient(90deg, rgba(214,198,255,0.85) 0%, rgba(255,198,229,0.85) 35%, rgba(255,241,168,0.85) 68%, rgba(167,216,255,0.85) 100%); box-shadow: 0 6px 18px rgba(31,41,55,0.15); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-dark); text-decoration: none; }
    .brand-badge { width: 36px; height: 36px; border-radius: 10px; background: conic-gradient(from 0deg, var(--light-purple), var(--light-pink), var(--light-yellow), var(--light-blue), var(--light-purple)); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7), 0 6px 14px rgba(31,41,55,0.18); }
    .brand-name { font-size: 20px; }
    .nav { display: flex; align-items: center; gap: 14px; }
    .nav a { text-decoration: none; color: var(--text-dim); font-weight: 600; padding: 10px 14px; border-radius: 10px; transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease; }
    .nav a:hover { transform: translateY(-1px); background: rgba(255,255,255,0.65); box-shadow: 0 8px 18px rgba(31,41,55,0.12); }

    .container { max-width: 1100px; margin: 28px auto 86px; padding: 0 16px; }

    .title { margin: 12px 0 6px 0; font-size: clamp(24px, 4vw, 36px); font-weight: 700; letter-spacing: 0.3px; background: linear-gradient(90deg, #5b21b6, #db2777, #ca8a04, #0369a1); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subtitle { margin: 0 0 8px 0; color: #374151; opacity: 0.9; }

    /* Two option cards */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 18px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    .card { position: relative; display: flex; align-items: flex-end; min-height: 160px; border-radius: 16px; text-decoration: none; color: #111827; padding: 16px; overflow: hidden; background: white; box-shadow: var(--card-shadow); transition: transform 160ms ease, box-shadow 160ms ease; border: 1px solid rgba(17, 24, 39, 0.06); cursor: pointer; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 35px rgba(31,41,55,0.18); }
    .card::before { content: ""; position: absolute; inset: -1px; border-radius: 16px; background: var(--accent, var(--light-blue)); opacity: 0.5; z-index: 0; }
    .card > span { position: relative; z-index: 1; font-weight: 700; font-size: 20px; letter-spacing: 0.2px; text-shadow: 0 1px 0 rgba(255,255,255,0.9); }
    .card.ai { --accent: var(--light-purple); }
    .card.classmates { --accent: var(--light-pink); }

    /* Panels */
    .panel { margin-top: 26px; display: none; }

    /* AI chat */
    .chat { background: rgba(255,255,255,0.8); border: 1px solid rgba(17,24,39,0.08); border-radius: 16px; box-shadow: 0 10px 25px rgba(31,41,55,0.12); overflow: hidden; }
    .chat-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 12px 14px; font-weight: 700; background: linear-gradient(90deg, rgba(214,198,255,0.5), rgba(255,198,229,0.45), rgba(255,241,168,0.45), rgba(167,216,255,0.5)); border-bottom: 1px solid rgba(17,24,39,0.08); }
    .chat-tools { display:flex; gap:8px; }
    .chat-body { max-height: 65vh; overflow: auto; padding: 14px; padding-bottom: 120px; display: flex; flex-direction: column; gap: 10px; }
    .msg { display: inline-block; max-width: 85%; padding: 10px 12px; border-radius: 14px; box-shadow: 0 6px 14px rgba(31,41,55,0.10); }
    .msg.user { align-self: flex-end; background: #e0f2fe; border: 1px solid rgba(3,105,161,0.15); }
    .msg.ai { align-self: flex-start; background: #f5f3ff; border: 1px solid rgba(91,33,182,0.15); }
    .msg.system { align-self: center; background: rgba(255,255,255,0.8); border: 1px dashed rgba(17,24,39,0.25); }
    .chat-input { position: relative; display: flex; gap: 10px; padding: 12px; border-top: 1px solid rgba(17,24,39,0.08); background: rgba(255,255,255,0.85); }
    .input { flex: 1; font: inherit; border: 1px solid rgba(17,24,39,0.15); background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 12px; }
    .btn { font: inherit; font-weight: 600; border: 1px solid rgba(17,24,39,0.15); background: rgba(255,255,255,0.85); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .btn.primary { background: linear-gradient(90deg, #60a5fa, #a78bfa); color: #fff; border: none; }

    /* Classmates feed */
    .feed { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .composer { background: rgba(255,255,255,0.8); border: 1px solid rgba(17,24,39,0.08); border-radius: 16px; padding: 12px; box-shadow: 0 10px 25px rgba(31,41,55,0.12); }
    .textarea { width: 100%; min-height: 90px; font: inherit; border: 1px solid rgba(17,24,39,0.15); background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 12px; resize: vertical; }
    .post { background: rgba(255,255,255,0.9); border: 1px solid rgba(17,24,39,0.08); border-radius: 16px; box-shadow: 0 10px 25px rgba(31,41,55,0.12); overflow: hidden; }
    .post-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: rgba(255,255,255,0.7); border-bottom: 1px solid rgba(17,24,39,0.06); }
    .post-title { font-weight: 700; }
    .post-actions { display: flex; gap: 8px; }
    .danger { color: #b91c1c; border-color: rgba(185,28,28,0.35); }
    .post-body { padding: 12px 14px; white-space: pre-wrap; }
    .answers { padding: 12px 14px; border-top: 1px solid rgba(17,24,39,0.06); background: rgba(248,250,252,0.6); display: grid; gap: 8px; }
    .answer { background: #ffffff; border: 1px solid rgba(17,24,39,0.08); border-radius: 12px; padding: 10px 12px; }
    .answer .by { font-size: 12px; color: #374151; opacity: 0.9; display:block; margin-bottom: 2px; }
    .answer-compose { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid rgba(17,24,39,0.06); background: rgba(255,255,255,0.8); }
    .answer-input { flex: 1; font: inherit; border: 1px solid rgba(17,24,39,0.15); padding: 8px 10px; border-radius: 10px; }

    .by { font-size: 12px; color: #374151; opacity: 0.9; display:block; margin-top: 4px; }

    .notice { display:flex; align-items:center; justify-content:space-between; gap:10px; background: rgba(255,255,255,0.85); border: 1px dashed rgba(17,24,39,0.25); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }

    /* util */
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--ring); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="topbar-wrap">
    <header class="topbar" role="navigation" aria-label="Top Navigation">
      <a class="brand" href="home.html">
        <div class="brand-badge" aria-hidden="true"></div>
        <div class="brand-name">StudySec</div>
      </a>
      <nav class="nav">
        <a href="home.html">Home</a>
        <a href="notes.html">Notes</a>
        <a href="flashcards.html">Flashcards</a>
      </nav>
    </header>
  </div>

  <main class="container">
    <h1 class="title">Q&A</h1>
    <p class="subtitle">Choose how to ask: AI assistance or classmates community.</p>

    <section class="grid" aria-label="Q&A options">
      <div id="cardAI" class="card ai"><span>Ask AI</span></div>
      <div id="cardClass" class="card classmates"><span>Ask Your Classmates</span></div>
    </section>

    <!-- AI Panel -->
    <section id="panelAI" class="panel">
      <div class="chat">
        <div class="chat-head">
          <div>Ask AI</div>
          <div class="chat-tools">
            <button id="apiKeyBtn" class="btn" title="Set API Key">API Key</button>
            <button id="clearChat" class="btn" title="Clear chat">Clear</button>
          </div>
        </div>
        <div id="chatBody" class="chat-body"></div>
        <div class="chat-input">
          <input id="chatInput" class="input" placeholder="Ask a question..." />
          <button id="sendBtn" class="btn primary">Send</button>
        </div>
      </div>
    </section>

    <!-- Classmates Panel -->
    <section id="panelClass" class="panel">
      <div class="composer">
        <div style="font-weight:700; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <span>Ask your classmates</span>
          <a href="profile.html" class="btn" id="profileLink">Go to Profile</a>
        </div>
        <textarea id="qCompose" class="textarea" placeholder="Write your question..."></textarea>
        <div class="notice hidden" id="profileNotice">
          <span>You need a profile to post. Create or complete your profile first.</span>
          <a class="btn" href="profile.html">Open Profile</a>
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
          <button id="postBtn" class="btn primary">Post</button>
        </div>
      </div>
      <div style="height:10px;"></div>
      <div id="feed" class="feed"></div>
    </section>
  </main>

  <script>
    (function(){
      // Local storage keys
      const QA_FEED_KEY = 'studysec.qa.feed.v1';
      const AI_CHAT_KEY = 'studysec.qa.ai.v1';
      const OPENAI_KEY = 'studysec.openai.apiKey';
      const PROFILE_KEY = 'studysec.profile.exists';
      const PROFILE_DATA_KEY = 'studysec.profile.data';
      const AUTH_CURRENT_KEY = 'studysec.auth.current';

      // Option cards and panels
      const cardAI = document.getElementById('cardAI');
      const cardClass = document.getElementById('cardClass');
      const panelAI = document.getElementById('panelAI');
      const panelClass = document.getElementById('panelClass');

      // AI Chat elements
      const chatBody = document.getElementById('chatBody');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const apiKeyBtn = document.getElementById('apiKeyBtn');
      const clearChat = document.getElementById('clearChat');

      // Classmates elements
      const qCompose = document.getElementById('qCompose');
      const postBtn = document.getElementById('postBtn');
      const feed = document.getElementById('feed');
      const profileNotice = document.getElementById('profileNotice');

      // Data
      /** @typedef {{ id:string, author:string, text:string, time:number, answers:{ id:string, author:string, text:string, time:number }[] }} Thread */
      /** @type {Thread[]} */
      let threads = [];
      let aiHistory = [];

      function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

      function getApiKey(){ return localStorage.getItem(OPENAI_KEY) || ''; }
      function setApiKey(k){ if(k) localStorage.setItem(OPENAI_KEY, k); }
      function clearApiKey(){ localStorage.removeItem(OPENAI_KEY); }

      function profileExists(){ return localStorage.getItem(PROFILE_KEY) === 'true'; }
      function currentUser(){ try{ return JSON.parse(localStorage.getItem(AUTH_CURRENT_KEY)||'null'); }catch{return null;} }
      function currentDisplayName(){ const u=currentUser(); if(u&&u.name) return u.name; try{ const p=JSON.parse(localStorage.getItem(PROFILE_DATA_KEY)||'{}'); return p.fullName||u?.email||'Anonymous'; }catch{return 'Anonymous';} }

      function load(){
        try { threads = JSON.parse(localStorage.getItem(QA_FEED_KEY) || '[]'); } catch { threads = []; }
        try { aiHistory = JSON.parse(localStorage.getItem(AI_CHAT_KEY) || '[]'); } catch { aiHistory = []; }
      }
      function persistFeed(){ localStorage.setItem(QA_FEED_KEY, JSON.stringify(threads)); }
      function persistAI(){ localStorage.setItem(AI_CHAT_KEY, JSON.stringify(aiHistory)); }

      function showPanel(which){
        panelAI.style.display = which==='ai' ? 'block' : 'none';
        panelClass.style.display = which==='class' ? 'block' : 'none';
        if(which==='ai') renderChat(); else { updateComposerLock(); renderFeed(); }
        window.scrollTo({ top: document.querySelector('.grid').offsetTop + 10, behavior: 'smooth' });
      }

      // Cards click
      cardAI.addEventListener('click', ()=> showPanel('ai'));
      cardClass.addEventListener('click', ()=> showPanel('class'));

      // AI chat renderer
      function addMsg(role, text){
        const div = document.createElement('div');
        div.className = 'msg ' + (role==='user'?'user': (role==='system'?'system':'ai'));
        div.textContent = text;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function renderChat(){
        chatBody.innerHTML = '';
        aiHistory.forEach(m => addMsg(m.role, m.text));
        if(aiHistory.length === 0){
          addMsg('ai', 'Hi! I am your StudySec helper. Ask me a question to get started.');
        }
      }

      // Mock fallback when no API key
      function mockAnswer(question){
        const q = question.toLowerCase();
        if(q.includes('define') || q.startsWith('what is')){
          return 'Here is a quick definition: ' + question.replace(/what is\s*/i,'').replace(/\?$/,'') + ' — a concept you can understand by breaking it into key parts, examples, and contrasts.';
        }
        if(q.includes('formula')){
          return 'A helpful approach: write the knowns, unknowns, and the relationships. Try dimensional analysis to verify your formula.';
        }
        if(q.includes('how to') || q.includes('steps')){
          return 'Try this plan: 1) Understand the goal, 2) List inputs, 3) Apply method step-by-step, 4) Check edge cases, 5) Validate the result.';
        }
        if(q.includes('prove') || q.includes('show that')){
          return 'Sketch a proof outline: assumptions, lemmas, main argument, and conclusion. Consider proof by contradiction or induction if relevant.';
        }
        return 'Here is a structured way to think about it: define terms, outline steps, work a simple example, then generalize. If you share more detail, I can tailor the answer.';
      }

      async function askOpenAI(prompt){
        const apiKey = getApiKey();
        if(!apiKey){ return { ok:false, text: mockAnswer(prompt) }; }
        try{
          const messages = [
            { role: 'system', content: 'You are StudySec, a concise, helpful study assistant for students across subjects. Explain clearly, step-by-step, and include short examples when relevant.' },
            ...aiHistory.map(m=>({ role: m.role==='user'?'user':'assistant', content: m.text })),
            { role: 'user', content: prompt }
          ];
          const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
            body: JSON.stringify({ model: 'gpt-4o-mini', messages, temperature: 0.2 })
          });
          if(!res.ok){
            return { ok:false, text: 'AI request failed (' + res.status + '). Using fallback answer: ' + mockAnswer(prompt) };
          }
          const data = await res.json();
          const text = data.choices?.[0]?.message?.content?.trim() || 'Sorry, I could not generate a response.';
          return { ok:true, text };
        } catch(err){
          return { ok:false, text: 'AI error. Using fallback answer: ' + mockAnswer(prompt) };
        }
      }

      async function send(){
        const text = chatInput.value.trim();
        if(!text) return;
        aiHistory.push({ role:'user', text });
        addMsg('user', text);
        chatInput.value = '';

        addMsg('system', 'Thinking…');
        const result = await askOpenAI(text);
        const last = chatBody.lastElementChild; if(last && last.classList.contains('system')) chatBody.removeChild(last);

        aiHistory.push({ role:'ai', text: result.text });
        addMsg('ai', result.text);
        persistAI();
      }

      chatInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
      sendBtn.addEventListener('click', send);
      apiKeyBtn.addEventListener('click', ()=>{
        const existing = getApiKey();
        const val = prompt('Enter your OpenAI API key (starts with sk-). Leave empty to clear.', existing || '');
        if(val === null) return;
        if(val.trim()) setApiKey(val.trim()); else clearApiKey();
        alert(getApiKey() ? 'API key saved locally.' : 'API key cleared. Using fallback answers.');
      });
      clearChat.addEventListener('click', ()=>{ if(confirm('Clear the chat history?')){ aiHistory = []; persistAI(); renderChat(); } });

      // Classmates feed
      function renderFeed(){
        feed.innerHTML = '';
        if(threads.length === 0){
          const empty = document.createElement('div');
          empty.className = 'post';
          empty.innerHTML = '<div class="post-body">No questions yet. Be the first to ask!</div>';
          feed.appendChild(empty);
          return;
        }
        threads.slice().sort((a,b)=>b.time - a.time).forEach(t => feed.appendChild(renderThread(t)));
      }

      function renderThread(t){
        const wrap = document.createElement('article');
        wrap.className = 'post';

        const head = document.createElement('div');
        head.className = 'post-head';
        const title = document.createElement('div');
        title.className = 'post-title';
        title.textContent = t.author || 'Anonymous';
        const actions = document.createElement('div');
        actions.className = 'post-actions';
        const del = document.createElement('button');
        del.className = 'btn danger';
        del.textContent = 'Delete';
        del.addEventListener('click', ()=>{ if(confirm('Delete this question?')) { deleteThread(t.id); } });
        actions.appendChild(del);
        head.appendChild(title);
        head.appendChild(actions);

        const body = document.createElement('div');
        body.className = 'post-body';
        body.textContent = t.text;

        const answers = document.createElement('div');
        answers.className = 'answers';
        if((t.answers||[]).length){
          t.answers.forEach(a=>{
            const ans = document.createElement('div');
            ans.className = 'answer';
            const by = document.createElement('span'); by.className='by'; by.textContent = a.author || 'Anonymous';
            const txt = document.createElement('div'); txt.textContent = a.text;
            ans.appendChild(by);
            ans.appendChild(txt);
            answers.appendChild(ans);
          });
        }

        const compose = document.createElement('div');
        compose.className = 'answer-compose';
        const input = document.createElement('input');
        input.className = 'answer-input';
        input.placeholder = 'Write an answer...';
        const add = document.createElement('button');
        add.className = 'btn';
        add.textContent = 'Answer';
        add.addEventListener('click', ()=>{
          const val = input.value.trim();
          if(!val) return;
          addAnswer(t.id, val);
          input.value='';
        });
        compose.appendChild(input);
        compose.appendChild(add);

        wrap.appendChild(head);
        wrap.appendChild(body);
        wrap.appendChild(answers);
        wrap.appendChild(compose);
        return wrap;
      }

      function updateComposerLock(){
        const allowed = profileExists() && !!currentUser();
        qCompose.disabled = !allowed;
        postBtn.disabled = !allowed;
        profileNotice.classList.toggle('hidden', allowed);
        if(!allowed){
          qCompose.placeholder = 'You need a profile to post. Go to Profile or Sign Up.';
        } else {
          qCompose.placeholder = 'Write your question...';
        }
      }

      function postQuestion(){
        if(!profileExists() || !currentUser()){
          alert('Please create your profile and sign in first.');
          return;
        }
        const text = qCompose.value.trim();
        if(!text) return;
        const author = currentDisplayName();
        threads.push({ id: uid(), author, text, time: Date.now(), answers: [] });
        persistFeed();
        qCompose.value = '';
        renderFeed();
      }

      function addAnswer(id, text){
        if(!profileExists() || !currentUser()){
          alert('Please sign in to answer.'); return;
        }
        const t = threads.find(x=>x.id===id);
        if(!t) return;
        const author = currentDisplayName();
        t.answers.push({ id: uid(), author, text, time: Date.now() });
        persistFeed();
        renderFeed();
      }

      function deleteThread(id){
        const i = threads.findIndex(x=>x.id===id);
        if(i===-1) return;
        threads.splice(i,1);
        persistFeed();
        renderFeed();
      }

      // Events
      postBtn.addEventListener('click', postQuestion);
      window.addEventListener('storage', (e)=>{ if(e.key === PROFILE_KEY || e.key===AUTH_CURRENT_KEY) updateComposerLock(); });

      // Initial
      load();
      updateComposerLock();
      renderFeed();
      renderChat();
    })();
  </script>
</body>
</html>
